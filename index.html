<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传统娱乐与生活导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 1. 背景反转：从浅色图片背景变为纯粹的极深色背景 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #0d0e15;
            margin: 0;
            padding: 40px 20px;
            color: #a0a5c0;
        }
        
        /* 2. 标题反转：改为极为显眼的霓虹亮色 */
        .header {
            color: #00ffcc;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 2px;
        }
        
        /* 3. 搜索框反转：从白透圆角变为深色直角，带有发光边框 */
        .search-container {
            padding: 1rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        
        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ff007f;
            border-radius: 0px; /* 完全直角 */
            outline: none;
            background-color: #161824;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            border-color: #00ffcc;
        }
        
        /* 4. 布局反转：从 6列Grid 网格 变为 单列垂直列表 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 5. 卡片反转：从浅白圆角悬浮 变为 深黑硬朗直角，横向通栏布局 */
        .link-item {
            background-color: #161824;
            border: 1px solid #26293c;
            border-radius: 0px; /* 直角 */
            padding: 15px 20px;
            transition: all 0.2s ease;
            height: auto;
        }
        
        /* 悬浮效果反转：向内缩进或变暗，而非向上飘起 */
        .link-item:hover {
            background-color: #1e2132;
            border-color: #00ffcc;
            transform: scale(0.99); /* 往里收缩 */
        }
        
        .link-item a {
            text-decoration: none;
            color: #e2e4ed;
            display: flex;
            flex-direction: row; /* 横向排列，与原网页的纵向相反 */
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }
        
        .link-icon {
            width: 32px;
            height: 32px;
            margin-right: 20px; /* 间距向右 */
            margin-bottom: 0px;
            object-fit: contain;
            filter: grayscale(20%);
        }
        
        .link-text {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
        }

        /* 描述反转：原网页没有描述，这里增加一句话简介 */
        .link-desc {
            font-size: 12px;
            color: #626784;
            margin-left: auto; /* 靠右对齐 */
        }

        /* 6. 页脚反转：由底部悬浮透明变为顶部或相对稳固的硬边框页脚 */
        .foot_marker {
            margin-top: 50px;
            text-align: center;
            font-size: 12px;
            color: #4e526e;
            padding: 20px 0;
            border-top: 1px solid #161824;
        }

        .foot_marker a {
            color: #ff007f;
            text-decoration: underline;
        }

        .foot_marker a:hover {
            color: #00ffcc;
        }        
    </style>
</head>
<body>

    <div class="header">娱乐与生活主页</div>

    <div class="search-container">
        <form action="https://www.baidu.com/s" method="get" target="_blank">
            <input class="search-box" type="text" name="wd" placeholder="百度一下，你就知道...">
        </form>
    </div>
    
    <div class="container">
        <div class="link-item">
            <a href="https://www.weibo.com" target="_blank">
                <img class="link-icon" src="https://weibo.com/favicon.ico" alt="微博">
                <span class="link-text">新浪微博</span>
                <span class="link-desc">随时随地发现新鲜事</span>
            </a>
        </div>
        
        <div class="link-item">
            <a href="https://www.tieba.baidu.com" target="_blank">
                <i class="fas fa-comments link-icon" style="color: #3b82f6;"></i>
                <span class="link-text">百度贴吧</span>
                <span class="link-desc">为你兴趣而生</span>
            </a>
        </div>

        <div class="link-item">
            <a href="https://www.bilibili.com" target="_blank">
                <img class="link-icon" src="https://www.bilibili.com/favicon.ico" alt="Bilibili">
                <span class="link-text">哔哩哔哩</span>
                <span class="link-desc">中国年轻人的文化社区</span>
            </a>
        </div>

        <div class="link-item">
            <a href="https://v.qq.com" target="_blank">
                <i class="fas fa-video link-icon" style="color: #10b981;"></i>
                <span class="link-text">腾讯视频</span>
                <span class="link-desc">不负好时光</span>
            </a>
        </div>

        <div class="link-item">
            <a href="https://www.taobao.com" target="_blank">
                <i class="fas fa-shopping-bag link-icon" style="color: #f59e0b;"></i>
                <span class="link-text">淘宝网</span>
                <span class="link-desc">淘我喜欢</span>
            </a>
        </div>

        <div class="link-item">
            <a href="https://www.jd.com" target="_blank">
                <i class="fas fa-shopping-cart link-icon" style="color: #ef4444;"></i>
                <span class="link-text">京东商城</span>
                <span class="link-desc">多快好省，只为品质生活</span>
            </a>
        </div>
        
        <div class="link-item">
            <a href="https://www.zhihu.com" target="_blank">
                <img class="link-icon" src="https://www.zhihu.com/favicon.ico" alt="知乎">
                <span class="link-text">知乎</span>
                <span class="link-desc">有问题，就会有答案</span>
            </a>
        </div>

        <div class="link-item">
            <a href="https://www.douban.com" target="_blank">
                <i class="fas fa-book-open link-icon" style="color: #059669;"></i>
                <span class="link-text">豆瓣网</span>
                <span class="link-desc">提供图书、电影、音乐评论</span>
            </a>
        </div>
    </div>

    <div class="foot_marker">
        <span>© 2026 传统大厂导航. 无权保留.</span> 
        <a href="#" target="_blank">关于我们</a>
    </div>

                }
            }
        });
    </script>
</body>
</html>
